<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#map{margin:0;width:100%;height:100%;font-family:'Microsoft YaHei',sans-serif;background:#f4ecdf}#hint{position:absolute;z-index:5;top:12px;left:12px;right:12px;padding:12px;background:#fffdf9ef;border-radius:10px;color:#574334;font-size:13px;pointer-events:none}</style></head><body><div id="map"></div><div id="hint">正在加载南京地图……</div><script>
const config=__CONFIG__;window._AMapSecurityConfig={securityJsCode:config.security};let map=null,pending=null,overlays=[];
const hint=document.getElementById('hint');
function point(p){return p&&Number.isFinite(p.lng)&&Number.isFinite(p.lat)?[p.lng,p.lat]:null}
function renderPlan(data){pending=data;if(!map)return;map.remove(overlays);overlays=[];let markers=[data.origin,...data.stops];markers.forEach((p,i)=>{let pos=point(p);if(!pos)return;let label=document.createElement('span');label.textContent=String(i)+' '+p.name;let marker=new AMap.Marker({position:pos,label:{direction:'top',content:label}});overlays.push(marker)});(data.segments||[]).forEach(s=>{let path=(s.geometry||'').split(';').map(v=>v.split(',').map(Number)).filter(v=>v.length===2&&v.every(Number.isFinite));if(path.length<2)return;overlays.push(new AMap.Polyline({path,strokeColor:s.mode==='WALK'?'#9a806a':s.mode==='METRO'?'#718c77':'#b76f49',strokeWeight:6,strokeStyle:s.mode==='WALK'?'dashed':'solid',showDir:true}));});map.add(overlays);if(overlays.length)map.setFitView(overlays,false,[55,35,35,35]);hint.textContent='规划路线 · 步行虚线 / 其余实线；编号从出发点0开始。道路拥堵与费用请查看左侧本次查询结果。';}
function start(){map=new AMap.Map('map',{zoom:12,center:[118.7969,32.0603],viewMode:'2D'});hint.textContent='南京市内路线 · 先生成并选择方案';if(pending)renderPlan(pending);}
const script=document.createElement('script');script.src='https://webapi.amap.com/maps?v=2.0&key='+encodeURIComponent(config.key)+'&callback=start';script.onerror=()=>hint.textContent='地图加载失败，请检查网络、JS Key及安全密钥。';document.head.appendChild(script);
</script></body></html>
